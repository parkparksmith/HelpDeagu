<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대구 아파트·분양권 실거래가 조회 - 데일리 실거래 v2</title>
    <meta name="description" content="대구 지역 아파트 및 분양권 실거래가를 조회합니다. DB 연동을 통해 실시간 데이터를 확인하세요.">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/trades.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9666444539079216"
        crossorigin="anonymous"></script>
    <style>
        .col-chk {
            display: none;
            width: 36px;
            text-align: center;
            vertical-align: middle;
        }

        .trades-container.selection-mode-active .col-chk {
            display: table-cell;
        }

        .trade-row-checkbox,
        .header-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="title-with-logo">
                <a href="../index.html" id="back-btn">
                    <span class="material-icons-round">arrow_back</span>
                    <span>홈으로</span>
                </a>
                <h1>데일리 실거래가 v2</h1>
            </div>
        </header>

        <!-- 워터마크 -->
        <div class="watermark">
            <img src="../LOGO1.png" alt="">
        </div>



        <!-- 날짜 및 기준 선택 -->
        <div class="date-selector"
            style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px;">
            <label for="date-type">기준일</label>
            <select id="date-type" class="date-select" style="min-width: 120px;">
                <option value="write_date" selected>등록일 기준</option>
                <option value="contract_date">계약일 기준</option>
            </select>

            <label for="trade-date">조회 날짜</label>
            <input type="date" id="trade-date" class="date-select"
                style="min-width: 150px; padding: 10px; border-radius: 8px;">

            <label style="margin-left: 10px;">거래유형</label>
            <div class="view-mode-toggle"
                style="display: flex; gap: 4px; background: rgba(255, 255, 255, 0.05); padding: 4px; border-radius: 8px; border: 1px solid var(--border);">
                <button class="icon-toggle-btn active deal-toggle-btn" onclick="setDealMode('sale')" data-deal="sale"
                    style="padding: 4px 12px; font-size: 0.9rem; border-radius:6px;">매매</button>
                <button class="icon-toggle-btn deal-toggle-btn" onclick="setDealMode('rent')" data-deal="rent"
                    style="padding: 4px 12px; font-size: 0.9rem; border-radius:6px;">전월세</button>
            </div>

            <label style="margin-left: 10px;">UI 유형</label>
            <div class="view-mode-toggle"
                style="display: flex; gap: 4px; background: rgba(255, 255, 255, 0.05); padding: 4px; border-radius: 8px; border: 1px solid var(--border);">
                <button class="icon-toggle-btn" onclick="setViewMode('normal')" data-mode="normal" title="일반형 (기본)">
                    <span class="material-icons-round">view_list</span>
                </button>
                <button class="icon-toggle-btn active" onclick="setViewMode('detailed')" data-mode="detailed"
                    title="자세히 (그래프 포함)">
                    <span class="material-icons-round">assessment</span>
                </button>
                <button class="icon-toggle-btn" onclick="setViewMode('simple')" data-mode="simple" title="간단히 (압축형)">
                    <span class="material-icons-round">view_headline</span>
                </button>
            </div>

            <button class="action-btn primary" onclick="loadDailyTrades()">
                <span class="material-icons-round">search</span>
                조회하기
            </button>
        </div>

        <!-- 로딩 인디케이터 -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <span>DB에서 데이터를 불러오는 중...</span>
        </div>

        <!-- 에러 메시지 -->
        <div id="error-message" class="error-message hidden"></div>

        <!-- 데이터 요약 -->
        <div id="data-summary" class="data-summary hidden">
            <div class="summary-card bounce-in" style="animation-delay: 0s; cursor: pointer;"
                onclick="filterBySummary('all')">
                <div class="icon-wrapper total">
                    <span class="material-icons-round">format_list_bulleted</span>
                </div>
                <div class="summary-content">
                    <span class="label">총 거래 건수</span>
                    <span class="value" id="summary-count">0</span>
                </div>
            </div>
            <div class="summary-card bounce-in" style="animation-delay: 0.1s; cursor: pointer;"
                onclick="filterBySummary('apt')">
                <div class="icon-wrapper apt">
                    <span class="material-icons-round">apartment</span>
                </div>
                <div class="summary-content">
                    <span class="label">아파트 거래</span>
                    <span class="value" id="summary-apt">0</span>
                </div>
            </div>
            <div class="summary-card bounce-in" style="animation-delay: 0.2s; cursor: pointer;"
                onclick="filterBySummary('presale')">
                <div class="icon-wrapper presale">
                    <span class="material-icons-round">receipt_long</span>
                </div>
                <div class="summary-content">
                    <span class="label">분양권 거래</span>
                    <span class="value" id="summary-presale">0</span>
                </div>
            </div>
            <div class="summary-card bounce-in" style="animation-delay: 0.3s; cursor: pointer;"
                onclick="filterBySummary('newhigh')">
                <div class="icon-wrapper new-high-apt">
                    <span class="material-icons-round">trending_up</span>
                </div>
                <div class="summary-content">
                    <span class="label">신고가(아파트/분양권)</span>
                    <span class="value" id="summary-newhigh">0</span>
                </div>
            </div>
        </div>

        <div id="sort-controls" class="sort-controls hidden"
            style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px solid var(--border); align-items: center;">
            <button id="group-by-gu-btn" class="icon-toggle-btn" onclick="toggleGroupByGu()"
                style="padding: 6px 12px; font-size: 0.85rem; display: flex; align-items: center; gap: 4px;">그룹 해제 <span
                    class="material-icons-round" style="font-size: 14px;">close</span></button>
            <div style="width: 1px; height: 16px; background: var(--border); margin: 0 4px;"></div>
            <button class="icon-toggle-btn sort-btn active" data-sort="price" onclick="toggleSort('price')"
                style="padding: 6px 12px; font-size: 0.85rem; display: flex; align-items: center; gap: 4px;">거래금액순 <span
                    class="sort-icon">▼</span></button>
            <button class="icon-toggle-btn sort-btn" data-sort="volume_same" onclick="toggleSort('volume_same')"
                style="padding: 6px 12px; font-size: 0.85rem; display: flex; align-items: center; gap: 4px;">동일면적건수순
                <span class="sort-icon">-</span></button>
            <button class="icon-toggle-btn sort-btn" data-sort="volume_all" onclick="toggleSort('volume_all')"
                style="padding: 6px 12px; font-size: 0.85rem; display: flex; align-items: center; gap: 4px;">전체거래건수순
                <span class="sort-icon">-</span></button>
            <button class="icon-toggle-btn sort-btn" data-sort="newhigh_price" onclick="toggleSort('newhigh_price')"
                style="padding: 6px 12px; font-size: 0.85rem; display: flex; align-items: center; gap: 4px;">신고가/거래금액순
                <span class="sort-icon">-</span></button>
        </div>

        <!-- 거래 데이터 테이블 -->
        <div id="trades-container" class="trades-container hidden">
            <div class="table-header">
                <h3>📊 전체 거래 내역 (v2)</h3>
                <div class="table-controls" style="display: flex; gap: 8px; align-items: center;">
                    <input type="text" id="capture-nickname" placeholder="닉네임 입력" title="캡처 이미지 우측 상단에 표시될 닉네임"
                        style="width: 80px; padding: 4px 8px; font-size: 0.85rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); outline: none;">
                    <button class="icon-toggle-btn" id="selection-mode-btn" onclick="toggleSelectionMode()"
                        title="캡처 선택 모드"
                        style="padding: 6px; display: flex; align-items: center; justify-content: center; background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2);">
                        <span class="material-icons-round" style="font-size: 1.2rem;">checklist_rtl</span>
                    </button>
                    <button class="icon-toggle-btn" id="capture-btn" onclick="captureTrades()" title="화면 캡처"
                        style="padding: 6px; display: flex; align-items: center; justify-content: center; background: rgba(59, 130, 246, 0.1); color: var(--primary-color);">
                        <span class="material-icons-round" style="font-size: 1.2rem;">photo_camera</span>
                    </button>
                    <select id="filter-district" onchange="filterTrades()">
                        <option value="all">전체 구/군</option>
                    </select>
                </div>
            </div>
            <div id="trades-table-container">
                <!-- JS에서 구별(gu) 테이블을 마크업으로 렌더링합니다 -->
            </div>
        </div>
    </div>

    <!-- 상세 모달 -->
    <div id="trade-detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDetailModal()">&times;</span>
            <div class="modal-header">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 8px;">
                    <div style="position: relative; width: 100%;">
                        <div
                            style="font-size: 0.75rem; background: var(--primary-color, #3b82f6); color: white; display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 6px;">
                            APT Info</div>
                        <div id="modal-apt-type-badge"
                            style="font-size: 0.75rem; background: #6b7280; color: white; display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 6px; margin-left: 4px;">
                            아파트</div>

                        <div style="position: relative; display: block;">
                            <h3 id="modal-apt-name-trigger"
                                style="margin:0; cursor: pointer; display: inline-flex; align-items: center; border-radius: 4px; padding: 2px 6px 2px 0;"
                                onclick="openModalAptSearch()" title="다른 아파트 검색">
                                <span id="modal-apt-name">단지명</span> <span class="material-icons-round"
                                    style="font-size: 1.2rem; margin-left: 2px; color: var(--text-muted);">arrow_drop_down</span>
                            </h3>

                            <div id="modal-apt-search-container"
                                style="display:none; position: absolute; top:-4px; left:-4px; min-width: 260px; z-index: 10000; background: var(--bg-card); border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); border: 2px solid var(--primary-color);">
                                <div
                                    style="display: flex; align-items: center; border-bottom: 1px solid var(--border); padding: 4px 8px;">
                                    <span class="material-icons-round"
                                        style="color: var(--primary-color); font-size: 1.2rem; margin-right: 4px;">search</span>
                                    <input type="text" id="modal-apt-search" placeholder="아파트명 검색..."
                                        oninput="handleModalSearch(this.value)" autocomplete="off"
                                        style="flex: 1; padding: 6px 4px; font-size: 1.1rem; font-weight: bold; border: none; background: transparent; color: var(--text-primary); outline: none;">
                                    <span class="material-icons-round"
                                        style="cursor: pointer; color: var(--text-muted); font-size: 1.2rem; padding: 4px;"
                                        onclick="closeModalAptSearch()">close</span>
                                </div>
                                <ul id="modal-apt-search-results"
                                    style="display:none; list-style:none; padding:0; margin:0; max-height:250px; overflow-y:auto; border-bottom-left-radius:6px; border-bottom-right-radius:6px; text-align: left;">
                                </ul>
                            </div>
                        </div>

                        <span id="modal-dong" class="modal-subtitle"
                            style="display:inline-block; margin-top:2px;">동이름</span>
                    </div>
                </div>

                <div class="modal-controls"
                    style="display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; align-items:center; background:var(--bg-card); padding:10px; border-radius:8px; border:1px solid var(--border);">
                    <div id="modal-deal-mode-toggle" class="view-toggle group"
                        style="background:var(--bg-body); padding:2px;">
                        <button class="icon-toggle-btn active" data-deal="sale" onclick="changeModalDealMode('sale')"
                            style="font-size:0.8rem; padding:4px 10px;">매매</button>
                        <button class="icon-toggle-btn" data-deal="rent" onclick="changeModalDealMode('rent')"
                            style="font-size:0.8rem; padding:4px 10px;">전월세</button>
                        <button class="icon-toggle-btn" data-deal="sale-rent" onclick="changeModalDealMode('sale-rent')"
                            style="font-size:0.8rem; padding:4px 10px;">매매+전세평균</button>
                    </div>

                    <select id="modal-area-select" onchange="changeModalArea(this.value)"
                        style="flex:1; min-width:120px; font-size:0.85rem; padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-body); color:var(--text-primary); outline:none;">
                        <!-- Options generated dynamically -->
                    </select>
                </div>
            </div>
            <div id="modal-price" class="modal-price-box">가격</div>
            <div id="modal-info" class="modal-info-box">
                <!-- 정보 채워짐 -->
            </div>
            <div class="modal-tabs-wrapper"
                style="margin-top:20px; display:flex; justify-content:space-between; align-items:flex-end;">
                <h4 style="margin: 0; font-size: 0.95rem; color: var(--text-primary);">실거래가 추이 및 내역</h4>
                <div id="modal-period-tabs" class="period-tabs" style="display:flex; gap:8px;">
                    <!-- JS 동적 버튼 렌더링 -->
                </div>
            </div>

            <div id="modal-loading" style="display:none; text-align:center; padding: 20px; color: var(--text-muted);">
                <div class="spinner"
                    style="width:24px; height:24px; display:inline-block; vertical-align:middle; border-width: 2px;">
                </div>
                <span style="display:inline-block; vertical-align:middle; margin-left: 8px;">전체 데이터 불러오는 중...</span>
            </div>

            <div id="modal-content-area">
                <div id="modal-chart">
                    <!-- 차트 그려짐 -->
                </div>

                <div id="modal-trade-list-container"
                    style="margin-top: 15px; height: 250px; min-height: 250px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid var(--border);">
                    <table class="premium-table"
                        style="width:100%; font-size: 0.85rem; text-align:center; table-layout: fixed;">
                        <thead style="position: sticky; top: 0; background: var(--bg-card); z-index: 1;">
                            <tr>
                                <th style="padding: 10px; text-align: center; width: 33%;">계약일</th>
                                <th style="padding: 10px; text-align: center; width: 44%;">거래가</th>
                                <th style="padding: 10px; text-align: center; width: 23%;">층</th>
                            </tr>
                        </thead>
                        <tbody id="modal-trade-list">
                            <!-- 거래 내역 표 생성됨 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- html2canvas 추가 (스크린샷 캡처용) -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <!-- Chart.js 및 플러그인 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>

    <script src="../js/daily-trades-v2.js"></script>
</body>

</html>
