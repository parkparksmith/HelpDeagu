<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 핫딜 - 초특가 쇼핑 정보 모음</title>
    <meta name="description" content="매일 업데이트되는 쇼핑 핫딜, 초특가 정보, 할인 모음입니다.">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/hotdeal.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-container hotdeal-page">
        <header class="app-header">
            <div class="title-with-logo">
                <img src="../LOGO1.png" alt="Logo" class="header-logo">
                <h1>오늘의 핫딜</h1>
            </div>
            <a href="../index.html" id="back-btn">
                <span class="material-icons-round">arrow_back</span>
                메인으로
            </a>
        </header>

        <main class="view active">
            <div class="date-header">
                <div>
                    <h2 id="deal-date-title">
                        <span class="material-icons-round">event</span>
                        <span id="deal-date-text">로딩중...</span>
                    </h2>
                    <div id="last-updated-time"
                        style="font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; margin-left: 32px; font-weight: 500;">
                    </div>
                </div>
                <div class="date-controls">
                    <button id="prev-date-btn" class="icon-btn" title="이전 날짜">
                        <span class="material-icons-round">chevron_left</span>
                    </button>
                    <button id="next-date-btn" class="icon-btn" title="다음 날짜" disabled>
                        <span class="material-icons-round">chevron_right</span>
                    </button>
                </div>
            </div>

            <section class="hotdeal-section">
                <div id="hotdeal-list" class="hotdeal-grid">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>핫딜 정보를 불러오는 중입니다...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/hotdeal.js"></script>
</body>

</html>
