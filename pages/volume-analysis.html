<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대구 아파트 거래량 분석 - 일별 추이 그래프</title>
    <meta name="description" content="대구 지역 아파트·분양권 일별 거래량 추이를 그래프로 확인합니다. 7일 이동평균선 및 1달 기준선 포함.">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/trades.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        .controls-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
        }

        .controls-panel label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .controls-panel select,
        .controls-panel input[type="date"],
        .controls-panel input[type="number"] {
            min-width: 130px;
            padding: 10px 12px;
            border-radius: 8px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .district-filter {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .district-filter > label {
            white-space: nowrap;
        }

        .district-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .district-chip {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--bg-dark);
            color: var(--text-muted);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .district-chip:hover {
            border-color: rgba(201, 162, 39, 0.4);
            color: var(--text-secondary);
        }

        .district-chip.active {
            background: rgba(201, 162, 39, 0.15);
            color: var(--accent);
            border-color: rgba(201, 162, 39, 0.5);
            font-weight: 600;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .control-row label {
            white-space: nowrap;
        }

        .control-row .separator {
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 0 2px;
        }

        .chart-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .chart-panel h3 {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            min-height: 350px;
        }

        .chart-wrapper canvas {
            width: 100% !important;
        }

        .legend-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-card .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-card .stat-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .controls-panel {
                flex-direction: column;
                align-items: stretch;
            }

            .control-row {
                flex-wrap: wrap;
            }

            .controls-panel select,
            .controls-panel input[type="date"],
            .controls-panel input[type="number"] {
                width: 100%;
                flex: 1;
                min-width: 0;
            }

            .chart-wrapper {
                min-height: 280px;
            }

            .stat-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="title-with-logo">
                <a href="../index.html" id="back-btn">
                    <span class="material-icons-round">arrow_back</span>
                    <span>홈으로</span>
                </a>
                <h1>거래량 분석</h1>
            </div>
        </header>

        <div class="watermark">
            <img src="../LOGO1.png" alt="">
        </div>

        <div class="controls-panel">
            <label for="date-type">기준</label>
            <select id="date-type">
                <option value="write_date">등록일 기준</option>
                <option value="contract_date" selected>계약일 기준</option>
            </select>

            <div class="district-filter">
                <label>거래유형</label>
                <div class="district-chips" id="trade-chips">
                    <button class="district-chip" data-trade="all" onclick="toggleTrade(this)">전체</button>
                    <button class="district-chip active" data-trade="apt" onclick="toggleTrade(this)">아파트매매</button>
                    <button class="district-chip" data-trade="presale" onclick="toggleTrade(this)">분양권매매</button>
                    <button class="district-chip" data-trade="rent" onclick="toggleTrade(this)">전세</button>
                </div>
            </div>

            <div class="district-filter">
                <label>구/군</label>
                <div class="district-chips" id="district-chips">
                    <button class="district-chip active" data-gu="all" onclick="toggleDistrict(this)">전체</button>
                    <button class="district-chip" data-gu="수성구" onclick="toggleDistrict(this)">수성구</button>
                    <button class="district-chip" data-gu="중구" onclick="toggleDistrict(this)">중구</button>
                    <button class="district-chip" data-gu="달서구" onclick="toggleDistrict(this)">달서구</button>
                    <button class="district-chip" data-gu="남구" onclick="toggleDistrict(this)">남구</button>
                    <button class="district-chip" data-gu="북구" onclick="toggleDistrict(this)">북구</button>
                    <button class="district-chip" data-gu="동구" onclick="toggleDistrict(this)">동구</button>
                    <button class="district-chip" data-gu="서구" onclick="toggleDistrict(this)">서구</button>
                    <button class="district-chip" data-gu="달성군" onclick="toggleDistrict(this)">달성군</button>
                    <button class="district-chip" data-gu="군위군" onclick="toggleDistrict(this)">군위군</button>
                </div>
            </div>

            <div class="control-row">
                <label for="start-date">기간</label>
                <input type="date" id="start-date">
                <span class="separator">~</span>
                <input type="date" id="end-date">
            </div>

            <div class="district-filter">
                <label>평형</label>
                <div class="district-chips" id="area-chips">
                    <button class="district-chip active" data-area="all" onclick="toggleArea(this)">전체</button>
                    <button class="district-chip" data-area="0-50" onclick="toggleArea(this)">~50㎡</button>
                    <button class="district-chip" data-area="50-80" onclick="toggleArea(this)">50~80㎡</button>
                    <button class="district-chip" data-area="80-90" onclick="toggleArea(this)">80~90㎡</button>
                    <button class="district-chip" data-area="90-" onclick="toggleArea(this)">90㎡~</button>
                </div>
            </div>

            <div class="control-row">
                <label for="min-amount">금액</label>
                <input type="number" id="min-amount" placeholder="최소 (억)" step="0.1" min="0" style="min-width: 100px;" oninput="onAmountChange()">
                <span class="separator">~</span>
                <input type="number" id="max-amount" placeholder="최대 (억)" step="0.1" min="0" style="min-width: 100px;" oninput="onAmountChange()">
                <span style="font-size: 0.75rem; color: var(--text-muted); white-space: nowrap;">억원</span>
            </div>

            <button class="action-btn primary" onclick="loadData()" style="width: auto; padding: 12px 24px; display: flex; align-items: center; gap: 8px;">
                <span class="material-icons-round">search</span>
                조회하기
            </button>
        </div>

        <div id="chart-controls" style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px 20px;margin-bottom:20px;display:none;flex-wrap:wrap;gap:14px;align-items:center;">
            <div class="district-filter" style="flex:1;min-width:200px;">
                <label>분류</label>
                <div class="district-chips" id="stack-chips">
                    <button class="district-chip active" data-stack="type" onclick="setStackMode(this)">거래유형</button>
                    <button class="district-chip" data-stack="district" onclick="setStackMode(this)">구/군</button>
                    <button class="district-chip" data-stack="area" onclick="setStackMode(this)">평형</button>
                </div>
            </div>
            <div class="district-filter" style="flex:1;min-width:200px;">
                <label>집계</label>
                <div class="district-chips" id="agg-chips">
                    <button class="district-chip active" data-agg="auto" onclick="setAggMode(this)">자동</button>
                    <button class="district-chip" data-agg="day" onclick="setAggMode(this)">일별</button>
                    <button class="district-chip" data-agg="week" onclick="setAggMode(this)">주별</button>
                    <button class="district-chip" data-agg="month" onclick="setAggMode(this)">월별</button>
                </div>
            </div>
            <button class="action-btn" id="zoom-reset-btn" onclick="resetZoom()" style="display:none;padding:6px 14px;font-size:0.8rem;gap:4px;">
                <span class="material-icons-round" style="font-size:1rem;">zoom_out_map</span>
                전체보기
            </button>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <span id="loading-text">거래량 데이터를 불러오는 중...</span>
        </div>

        <div id="error-message" class="error-message hidden"></div>

        <div id="data-warning" class="hidden" style="background: rgba(210, 153, 34, 0.12); border: 1px solid rgba(210, 153, 34, 0.35); color: #d29922; padding: 14px 20px; border-radius: 12px; margin-bottom: 20px; font-size: 0.85rem; display: flex; align-items: center; gap: 10px;">
            <span class="material-icons-round" style="font-size: 1.2rem;">warning</span>
            <span>등록일 기준 데이터는 <strong>2026년 2월 24일</strong>부터 정상 수집됩니다. 그 이전 데이터는 누락 또는 오류가 있을 수 있습니다.</span>
        </div>

        <div id="stat-cards" class="stat-cards hidden">
            <div class="stat-card">
                <div class="stat-label">조회기간 총 거래</div>
                <div class="stat-value" id="stat-total">-</div>
                <div class="stat-sub" id="stat-period-range"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">일평균 거래량</div>
                <div class="stat-value" id="stat-avg">-</div>
                <div class="stat-sub">거래일 기준</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">최대 거래일</div>
                <div class="stat-value" id="stat-max">-</div>
                <div class="stat-sub" id="stat-max-date"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">최근 7일 평균</div>
                <div class="stat-value" id="stat-recent-avg">-</div>
                <div class="stat-sub">7일 이동평균</div>
            </div>
        </div>

        <div id="chart-panel" class="chart-panel hidden">
            <h3 id="chart-title">
                <span class="material-icons-round">show_chart</span>
                <span id="chart-title-text">거래유형별 거래량</span>
            </h3>
            <div class="chart-wrapper"><canvas id="volume-chart"></canvas></div>
            <div class="legend-row" id="chart-legend"></div>
            <div style="margin-top:8px;font-size:0.72rem;color:var(--text-muted);text-align:right;">
                <span class="material-icons-round" style="font-size:0.85rem;vertical-align:middle;">mouse</span>
                마우스 휠 또는 드래그로 확대 · 더블클릭으로 초기화
            </div>
        </div>
    </div>

    <script src="../js/volume-analysis.js"></script>
</body>

</html>
